name: Update profile graphics

on:
  schedule:
    - cron: "41 4 * * *" # daily, ~midnight in Toronto
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "content/**"
      - "profile.config.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: read

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # only to commit the regenerated graphics
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Type-check and test
        run: npm run typecheck && npm test

      - name: Fetch GitHub data
        env:
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: npm run fetch

      - name: Render graphics
        run: npm run generate

      - name: Validate output
        run: npm run validate

      - name: Commit if changed
        run: |
          git add assets/generated data/snapshot.json README.md
          if git diff --cached --quiet; then
            echo "Graphics unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh profile graphics"
          git push
